<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Web Hub • BY SANNN</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 0%,#173d6b 0%,transparent 35%),
    radial-gradient(circle at 100% 100%,#32145c 0%,transparent 35%),
    linear-gradient(135deg,#050914,#0b1220);
  display:flex;
  justify-content:center;
  padding:25px 16px;
}

.container{
  width:100%;
  max-width:600px;
}

/* HEADER */

.header{
  text-align:center;
  margin:20px 0 28px;
  animation:fadeDown .7s ease;
}

.logo{
  width:78px;
  height:78px;
  margin:auto;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  box-shadow:0 15px 45px #2563eb55;
  animation:float 3s ease-in-out infinite;
}

h1{
  margin:16px 0 6px;
  font-size:30px;
}

.subtitle{
  color:#94a3b8;
  font-size:14px;
}

/* MENU */

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu-button{
  width:100%;
  border:1px solid rgba(255,255,255,.1);
  background:rgba(255,255,255,.07);
  color:#fff;
  border-radius:20px;
  padding:16px;
  display:flex;
  align-items:center;
  gap:15px;
  text-align:left;
  cursor:pointer;
  backdrop-filter:blur(15px);
  box-shadow:0 8px 25px rgba(0,0,0,.15);
  transition:.25s ease;
  animation:fadeUp .6s ease both;
}

.menu-button:nth-child(2){
  animation-delay:.1s;
}

.menu-button:nth-child(3){
  animation-delay:.2s;
}

.menu-button:active{
  transform:scale(.97);
}

.menu-button:hover{
  transform:translateY(-4px);
  background:rgba(59,130,246,.18);
  border-color:#3b82f6;
  box-shadow:0 15px 35px #0006;
}

.icon{
  width:52px;
  height:52px;
  flex-shrink:0;
  border-radius:16px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:25px;
  background:linear-gradient(135deg,#1d4ed8,#7c3aed);
}

.menu-text{
  flex:1;
}

.menu-text strong{
  display:block;
  font-size:17px;
  margin-bottom:5px;
}

.menu-text small{
  color:#94a3b8;
  font-size:11px;
  line-height:1.4;
}

.arrow{
  color:#64748b;
  font-size:27px;
}

/* FOOTER */

.footer{
  text-align:center;
  color:#64748b;
  font-size:11px;
  margin-top:28px;
  letter-spacing:2px;
}

/* ANIMATION */

@keyframes fadeDown{
  from{
    opacity:0;
    transform:translateY(-25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(25px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes float{
  0%,100%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-8px);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <div class="logo">
      🌐
    </div>

    <h1>Web Hub</h1>

    <div class="subtitle">
      Pilih website yang ingin kamu buka
    </div>

  </div>


  <div class="menu">

    <!-- WEB 1 -->

    <button
      class="menu-button"
      onclick="openQuran()">

      <div class="icon">
        📖
      </div>

      <div class="menu-text">
        <strong>1. Web Al-Qur'an</strong>

        <small>
          Baca Al-Qur'an dan gunakan fitur Islami
        </small>
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- WEB 2 -->

    <button
      class="menu-button"
      onclick="openTabungan()">

      <div class="icon">
        💰
      </div>

      <div class="menu-text">
        <strong>2. Web Tabungan</strong>

        <small>
          Dashboard tabungan dan keuangan
        </small>
      </div>

      <div class="arrow">
        ›
      </div>

    </button>


    <!-- WEB 3 -->

    <button
      class="menu-button"
      onclick="comingSoon()">

      <div class="icon">
        ✨
      </div>

      <div class="menu-text">
        <strong>3. Web Segera Hadir</strong>

        <small>
          Website berikutnya akan ditambahkan
        </small>
      </div>

      <div class="arrow">
        ›
      </div>

    </button>

  </div>


  <div class="footer">
    BY SANNN
  </div>

</div>


<script>

function openQuran(){

  window.location.href =
  "https://muhammadakhsan0512-web.github.io/Al-quran-by-sannn/";

}


function openTabungan(){

  window.location.href =
  "https://muhammadakhsan0512-web.github.io/Tabungan.akhsan/";

}


function comingSoon(){

  alert("Web nomor 3 belum tersedia. ✨");

}

</script>

</body>
</html>
